# Chạy kiểm thử tự động cho mọi pull request và mọi lần đẩy mã lên hai nhánh
# chính. Trước tệp này kho **không có gì** chạy kiểm thử khi đẩy mã — docs/06
# mục "Việc còn thiếu trong chính kế hoạch này" điều 1, backlog K17.
#
# Hai việc chạy song song, tách vì một bên cần trình duyệt còn bên kia không:
#
#   kiem-thu   toàn bộ bài không cần trình duyệt, kể cả bài `cham`   ~5 phút
#   e2e        bài Playwright với Chromium thật                       ~2 phút
#
# Vì sao gộp `cham` vào lượt PR thay vì hẹn giờ chạy đêm: sáu bài sức chứa
# nặng nhất (100k/300k dòng) **tự bỏ qua** khi thiếu fixture kiểm tải riêng,
# nên cả nhóm `cham` chỉ tốn khoảng 45 giây. Đo ngày 19.09.2026: 13 đạt,
# 6 bỏ qua, 2 xfail. Nếu sau này có ai bật các bài đó lên thì tách job riêng.
name: CI

on:
  pull_request:
    branches:
      - codex/crm-update-solar-ui
      - main
  push:
    branches:
      - codex/crm-update-solar-ui
      - main
  workflow_dispatch:

# Đẩy tiếp lên cùng một nhánh thì huỷ lượt đang chạy, khỏi xếp hàng vô ích
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Khớp mặc định của knjsc/settings/base.py; settings/test.py kế thừa dev.py
  POSTGRES_DB: knjsc_db
  POSTGRES_USER: knjsc
  POSTGRES_PASSWORD: knjsc
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: khoa-chi-dung-trong-ci-khong-phai-khoa-that
  PYTHONUNBUFFERED: "1"

jobs:
  # ── Bộ chính: mọi bài không cần trình duyệt ─────────────────────
  kiem-thu:
    name: pytest (bộ chính)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: knjsc_db
          POSTGRES_USER: knjsc
          POSTGRES_PASSWORD: knjsc
        ports:
          - 5432:5432
        # Bài kiểm tự tạo database riêng `test_knjsc_db`; tài khoản trên là
        # superuser của image nên tạo được, và `TrigramExtension` của
        # core/0002_pg_trgm cũng cần đúng quyền đó
        options: >-
          --health-cmd "pg_isready -U knjsc -d knjsc_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Cùng phiên bản với deploy/Dockerfile
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Cài phụ thuộc
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Kiểm cấu hình Django
        working-directory: app
        run: python manage.py check --settings=knjsc.settings.test

      - name: pytest
        working-directory: app
        # `--ds=knjsc.settings.test` đã nằm trong addopts của pytest.ini.
        # **Không thêm `-q`**: pytest.ini đã có một cái, thêm nữa thành `-qq`
        # và mất luôn dòng tổng kết "N passed" trong log.
        # `-rs` in lý do từng bài bỏ qua — bỏ qua không phải là đã kiểm.
        run: pytest -m "not trinh_duyet" -rs --durations=10

  # ── Bài trình duyệt thật ────────────────────────────────────────
  e2e:
    name: pytest e2e (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: knjsc_db
          POSTGRES_USER: knjsc
          POSTGRES_PASSWORD: knjsc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knjsc -d knjsc_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Cài phụ thuộc
        working-directory: app
        run: pip install -r requirements-dev.txt

      # Chromium tải một lần rồi dùng lại; khoá theo phiên bản Playwright ghim
      # trong requirements-dev.txt, đổi phiên bản là tự tải lại
      - name: Lấy Chromium từ bộ nhớ đệm
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/requirements-dev.txt') }}

      - name: Cài Chromium
        working-directory: app
        # `--with-deps` cài cả thư viện hệ thống Chromium cần; vẫn phải chạy
        # khi trúng đệm vì đệm chỉ giữ trình duyệt, không giữ gói apt.
        # Không cần Node ở đây: bài e2e là pytest gọi Playwright bản Python.
        # Hơn 70 script `scripts/kiem-thu-*.cjs` mới cần Node, chúng chạy tay
        # và đòi server riêng nên không nằm trong CI.
        run: playwright install --with-deps chromium

      # ── Vì sao hai lượt pytest chứ không một ──────────────────────
      # `tests/e2e/conftest.py` giữ một Playwright **theo phiên**; hai tệp
      # e2e khác lại tự mở `sync_playwright()` của riêng chúng. Chạy chung
      # một tiến trình thì tệp nào tới sau cũng nổ "Playwright Sync API
      # inside the asyncio loop" — vòng lặp asyncio của phiên trước vẫn còn
      # sống. Lượt CI đầu tiên (run 1, 19.09.2026) đỏ đúng vì lẽ đó.
      # Hai tiến trình riêng là hai vòng lặp riêng, không phải cách vá tạm:
      # chúng vốn là hai bộ thiết bị khác nhau. Gộp lại được khi nào các tệp
      # kia dùng chung fixture của `tests/e2e/conftest.py`.
      #
      # ── Khi một bài treo (TL-71) ───────────────────────────────────
      # Lượt #107 (29.09) và #120 (01.10) đứng im tới khi job hết 20 phút,
      # log trống trơn: với `-q` của pytest.ini, mọi dấu chấm nằm trên một
      # dòng chưa xuống dòng. Nên ở hai bước dưới:
      #   -vv                         mỗi bài một dòng (pytest.ini có -q, nên
      #                               cần hai v mới ra tên bài); dòng cuối cùng
      #                               là bài vừa xong, bài treo là bài kế tiếp
      #   -o faulthandler_timeout=120 bài nào đứng quá 2 phút thì in ngăn xếp
      #                               mọi luồng, kèm ngăn xếp greenlet của
      #                               Playwright (`conftest.py` gốc) — bài
      #                               chậm nhất hiện mất chừng 30 giây
      #   timeout-minutes             bước treo tự dừng, job còn thời gian giữ
      #                               ảnh và in log Postgres
      - name: pytest e2e (tests/e2e)
        working-directory: app
        timeout-minutes: 10
        run: pytest tests/e2e -m "trinh_duyet" -vv -rs --durations=10 -o faulthandler_timeout=120

      - name: pytest e2e (bài trình duyệt còn lại)
        working-directory: app
        # Tám tệp `*_browser*.py` ở đây **tự bỏ qua** vì đòi biến môi trường
        # riêng (KN_MASTER_BROWSER, CRM_UPDATE_BROWSER…): chúng là giá đỡ cho
        # script Node chạy tay, không phải bài kiểm độc lập. `-rs` in rõ từng
        # cái — bỏ qua không phải là đã kiểm.
        #
        # crm/tests/test_luoi_dong_trong_va_ghim_e2e.py từng bị --deselect ở đây
        # vì đỏ sẵn từ trước khi có tệp CI này. Sửa 29.09.2026 (TL-68): ba bài
        # đỏ là do bài kiểm tụt sau ADR-036 và ADR-040, không phải lỗi ứng dụng
        # — nay chạy lại trong lượt này.
        #
        # -vv, faulthandler_timeout, timeout-minutes: như bước trên (TL-71).
        timeout-minutes: 8
        run: >-
          pytest -m "trinh_duyet"
          --ignore=tests/e2e
          -vv -rs --durations=10
          -o faulthandler_timeout=120

      - name: Giữ ảnh chụp màn hình
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-e2e
          path: storage/e2e/
          if-no-files-found: ignore
          retention-days: 7
