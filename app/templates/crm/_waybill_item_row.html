{# Một dòng chi tiết sản phẩm; `item` trống là dòng mới (mẫu cho nút Thêm dòng). #}
<tr>
      <td><select class="o-nhap" name="product" aria-label="Sản phẩm"{% if not with_payment %} required{% endif %}>
        <option value="">Chọn sản phẩm</option>
        {% for p in products %}<option value="{{ p.code }}" data-unit="{{ p.unit }}" {% if p.code == item.product %}selected{% endif %}>{{ p.name }}{% if not p.is_active %} (ngừng bán){% endif %}</option>{% endfor %}
      </select></td>
      <td><select class="o-nhap" name="unit" aria-label="Đơn vị tính">
        <option value="">{% if with_payment %}Chưa xác định{% else %}Theo sản phẩm{% endif %}</option>
        {% for unit in units %}<option value="{{ unit }}" {% if unit == item.unit %}selected{% endif %}>{{ unit }}</option>{% endfor %}
      </select></td>
      <td><input class="o-nhap" name="quantity" value="{{ item.quantity|default:1 }}" type="number" min="1" step="1" aria-label="Số lượng" required></td>
      <td><input class="o-nhap" name="unit_price" value="{{ item.unit_price|default:'0.00' }}" inputmode="decimal" aria-label="Đơn giá" required></td>
      {% if with_payment %}<td><input class="o-nhap" name="paid_amount" value="{{ item.paid_amount|default:'0.00' }}" inputmode="decimal" aria-label="Đã thanh toán" required></td>{% endif %}
      <td><button type="button" class="nut nut-nguy" data-remove-item>Bỏ dòng</button></td>
    </tr>
