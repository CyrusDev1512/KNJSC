<div class="vd-quick-bar">
  <form method="get" class="vd-quick-form">
    {% for k, v in quick_filters.keep %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
    {% for group in quick_filters.groups %}
      <details class="vd-quick-group">
        <summary>{{ group.name }}</summary>
        <div class="vd-quick-options">
          {% for value, selected in group.items %}
          <label><input type="checkbox" name="{{ group.param }}" value="{{ value }}"{% if selected %} checked{% endif %}> {{ value }}</label>
          {% endfor %}
        </div>
      </details>
    {% endfor %}
    <button class="nut nut-chinh" type="submit">Áp dụng lọc</button>
    <button class="nut" type="button" id="vd-open-filters">Bộ lọc chi tiết</button>
  </form>
  {% if can_assign %}<button class="nut" type="button" id="vd-assign-selected">Phân công dòng đã chọn</button>{% endif %}
</div>
{% if chips %}<div class="chip-loc-hang" aria-label="Điều kiện đang áp dụng">{% for label, url in chips %}<a class="chip chip-nhan chip-loc" href="{{ url }}" title="Bỏ lọc này">{{ label }} ×</a>{% endfor %}</div>{% endif %}
