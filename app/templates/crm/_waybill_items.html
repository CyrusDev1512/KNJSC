<div class="vd-items-scroll">
<table class="bang vd-items"{% if with_payment %} data-allow-empty{% endif %}>
  <thead><tr><th scope="col">Sản phẩm</th><th scope="col">Đơn vị</th><th scope="col">Số lượng</th><th scope="col">Đơn giá</th>{% if with_payment %}<th scope="col">Đã thanh toán</th>{% endif %}<th scope="col">Thao tác</th></tr></thead>
  <tbody>
    {% for item in items %}{% include "crm/_waybill_item_row.html" %}{% endfor %}
  </tbody>
</table>
</div>
{% if with_payment %}<p class="vd-note" data-items-empty{% if items %} hidden{% endif %}>Đơn chưa có sản phẩm. Bấm ＋ Thêm dòng để chọn, hoặc Lưu để giữ đơn không sản phẩm.</p>{% endif %}
<template data-item-template>{% include "crm/_waybill_item_row.html" with item=None %}</template>
<button type="button" class="nut" data-add-item><span aria-hidden="true">＋</span> Thêm dòng</button>
