{% comment %}Nút thích — mảnh HTMX, thay chính nó sau mỗi lần bấm. Cần: bai, da_thich, so_thich.{% endcomment %}
<button class="nut nut-nho nut-thich" type="button"
        hx-post="{% url 'bang_tin_thich' bai.pk %}" hx-target="this" hx-swap="outerHTML"
        aria-pressed="{% if da_thich %}true{% else %}false{% endif %}">
  {% if da_thich %}♥ Đã thích{% else %}♡ Thích{% endif %} <span class="so">{{ so_thich }}</span>
</button>
