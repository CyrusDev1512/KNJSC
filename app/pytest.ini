[pytest]
# Dùng --ds chứ không chỉ khai DJANGO_SETTINGS_MODULE: biến môi trường của
# container đè lên khai báo trong tệp ini, còn --ds thì thắng tất cả.
addopts = -q --strict-markers --ds=knjsc.settings.test
DJANGO_SETTINGS_MODULE = knjsc.settings.test
python_files = test_*.py

# Thiếu một app ở đây là bài kiểm trong đó lặng lẽ không chạy mà không ai biết.
# `tests` là thư mục kiểm thử xuyên nhiều module, không phải app Django.
testpaths = tests core org forms_builder reports orders dashboard crm

markers =
    cham: bài chạy lâu, bỏ qua bằng `-m "not cham"` khi cần vòng lặp nhanh
