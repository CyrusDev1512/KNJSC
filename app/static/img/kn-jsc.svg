  </defs>
  <rect width="256" height="256" rx="58" fill="url(#nen)"/>
  <circle cx="214" cy="42" r="118" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="128" y="153" font-size="124" letter-spacing="-3" font-family="'Be Vietnam Pro', FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" fill="#FFFFFF" text-anchor="middle">KN</text>
  <rect x="88" y="171" width="80" height="9" rx="4.5" fill="#F5A524"/>
