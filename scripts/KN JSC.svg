<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Logo KN JSC — nguồn vẽ cho biểu tượng "KN JSC.ico" cùng thư mục (lối tắt
    ngoài Desktop do "KN JSC.bat" tạo). Chữ KN đậm trắng trên nền xanh, vạch
    cam, chữ JSC nhỏ bên dưới.

    Dựng lại .ico: kết xuất tệp này ở 16 24 32 48 64 128 256 px (Chromium,
    phóng 4 lần rồi thu nhỏ trung bình khối). Cỡ 32 px trở xuống bỏ nhóm
    id="phu" và phóng chữ KN lên cỡ 152 (y=184, letter-spacing -6) cho dễ đọc.
    Cỡ 64 px trở xuống lưu dạng BMP 32 bit, hai cỡ lớn lưu dạng PNG.
  -->
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173C8F"/>
      <stop offset="1" stop-color="#1877E0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#nen)"/>
  <circle cx="214" cy="42" r="118" fill="#FFFFFF" fill-opacity="0.07"/>
  <text id="chu-kn" x="128" y="153" font-size="124" letter-spacing="-3" font-family="FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" fill="#FFFFFF" text-anchor="middle">KN</text>
  <g id="phu">
    <rect x="88" y="171" width="80" height="9" rx="4.5" fill="#F5A524"/>
    <text x="132" y="225" font-size="42" letter-spacing="9" font-family="FreeSans, 'Liberation Sans', Arial, Helvetica, sans-serif" font-weight="700" fill="#D6E4FF" text-anchor="middle">JSC</text>
  </g>
</svg>
