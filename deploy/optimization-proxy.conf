# Proxy chỉ cho thử nghiệm localhost; không dùng cấu hình này cho Internet.
client_max_body_size 11m;
map $http_x_request_id $correlation_id { "~^[0-9a-fA-F]{32}$" $http_x_request_id; default $request_id; }
proxy_hide_header X-Request-ID;
add_header X-Request-ID $correlation_id always;
log_format technical escape=json '{"request_id":"$correlation_id","status":$status,"ms":$request_time,"upstream_ms":"$upstream_response_time","connection":$connection,"requests":$connection_requests}';
server {
    listen 80;
    access_log /var/log/nginx/access.log technical;
    gzip on;
    gzip_types application/json text/css application/javascript;
    location / {
        proxy_pass http://crm-opt-diagnostic:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_next_upstream off;
    }
}
