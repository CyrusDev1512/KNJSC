# Cấu hình ứng viên VPS. Dự án/volume riêng; không thay Compose local.
name: knjsc-production
x-app: &app
  image: ${KNJSC_IMAGE:?Cần image đã build và gắn tag}
  restart: unless-stopped
  env_file: .env
  environment: &environment
    DJANGO_SETTINGS_MODULE: knjsc.settings.prod
    POSTGRES_HOST: db
    REDIS_URL: redis://broker:6379/0
    CRM_CACHE_URL: redis://cache:6379/0
    RUN_MIGRATIONS: '0'
    STORAGE_DIR: /storage
    CRM_REQUEST_METRICS: '1'
    # Tất cả nhóm chỉ bật sau nghiệm thu tương ứng.
    CRM_OPT_READ: ${CRM_OPT_READ:-0}
    CRM_OPT_SYNC: ${CRM_OPT_SYNC:-0}
    CRM_OPT_RECEIPTS: ${CRM_OPT_RECEIPTS:-0}
    CRM_OPT_RENDER: ${CRM_OPT_RENDER:-0}
    CRM_OPT_STATS: ${CRM_OPT_STATS:-0}
    CRM_OPT_EXPORT: ${CRM_OPT_EXPORT:-0}
    CRM_OPT_QUEUES: ${CRM_OPT_QUEUES:-0}
  volumes:
    - storage:/storage
    - static:/staticfiles
  depends_on:
    db: {condition: service_healthy}
    broker: {condition: service_started}
    cache: {condition: service_started}
services:
  static-owner:
    image: ${KNJSC_IMAGE:?Cần image đã build và gắn tag}
    profiles: [maintenance]
    user: '0'
    entrypoint: [chown, '1000:1000', /staticfiles]
    volumes: [static:/staticfiles]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    command: [postgres, -c, shared_buffers=4GB, -c, work_mem=8MB, -c, max_connections=80, -c, log_min_duration_statement=-1, -c, log_statement=none, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    # Không bật log câu SQL thật trong production: có thể chứa dữ liệu khách.
    # slow query đo qua pg_stat_activity/EXPLAIN trên dữ liệu test khi nghiệm thu.
    shm_size: 1gb
    mem_limit: 8g
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  broker:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory, 1gb, --maxmemory-policy, noeviction]
    volumes: [broker:/data]
    mem_limit: 1536m
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --maxmemory, 512mb, --maxmemory-policy, allkeys-lru, --save, '', --appendonly, 'no']
    mem_limit: 768m
  crm:
    <<: *app
    environment:
      <<: *environment
      DJANGO_SETTINGS_MODULE: knjsc.settings.bangtinh
      BANGTINH_GOC: prod
    command: [gunicorn, knjsc.wsgi:application, --bind, '0.0.0.0:8000', --workers, '3', --threads, '4', --worker-class, gthread, --keep-alive, '5']
    mem_limit: 3g
  erp:
    <<: *app
    command: [gunicorn, knjsc.wsgi:application, --bind, '0.0.0.0:8000', --workers, '2', --threads, '2', --worker-class, gthread, --keep-alive, '5']
    mem_limit: 2g
  worker:
    <<: *app
    command: [celery, -A, knjsc, worker, -l, info, --concurrency, '1', --prefetch-multiplier, '1', -Q, celery, -n, 'general@%h']
    mem_limit: 1536m
  heavy:
    <<: *app
    command: [celery, -A, knjsc, worker, -l, info, --concurrency, '1', --prefetch-multiplier, '1', -Q, crm_heavy, -n, 'heavy@%h']
    mem_limit: 2g
  beat:
    <<: *app
    command: [celery, -A, knjsc, beat, -l, info, --schedule, /storage/celerybeat-schedule]
    mem_limit: 512m
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      CRM_HOST: ${CRM_HOST:?Cần hostname CRM}
      ERP_HOST: ${ERP_HOST:?Cần hostname ERP}
      NGINX_ENVSUBST_FILTER: '^(CRM_HOST|ERP_HOST)$$'
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certificates:/etc/nginx/certificates:ro
      - static:/staticfiles:ro
    ports: ['80:80', '443:443']
    depends_on: [crm, erp]
    mem_limit: 512m
volumes:
  postgres:
  broker:
  storage:
  static:
